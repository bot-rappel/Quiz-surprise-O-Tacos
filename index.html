<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz O'Tacos - Groupe AMAUH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #f97316 0%, #dc2626 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 30px; margin-bottom: 20px; }
        h1 { color: #f97316; font-size: 2.5em; text-align: center; margin-bottom: 10px; }
        h2 { color: #1f2937; font-size: 1.8em; margin-bottom: 20px; }
        h3 { color: #374151; font-size: 1.3em; margin-bottom: 15px; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 8px; font-size: 0.9em; }
        input, select { width: 100%; padding: 12px; border: 2px solid #d1d5db; border-radius: 8px; font-size: 1em; }
        input:focus, select:focus { outline: none; border-color: #f97316; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #f97316, #dc2626); color: white; width: 100%; padding: 16px; font-size: 1.1em; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(249, 115, 22, 0.4); }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-small { padding: 8px 16px; font-size: 0.9em; }
        .quiz-size { background: #fff7ed; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .size-options { display: flex; gap: 12px; flex-wrap: wrap; }
        .size-btn { padding: 12px 24px; border: 2px solid #fed7aa; background: white; color: #9a3412; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .size-btn.active { background: #f97316; color: white; border-color: #f97316; }
        .option-btn { width: 100%; text-align: left; padding: 16px; margin-bottom: 12px; border: 2px solid #e5e7eb; background: white; border-radius: 8px; font-size: 1em; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover { border-color: #f97316; background: #fff7ed; }
        .option-letter { display: inline-block; width: 32px; height: 32px; background: #fff7ed; color: #f97316; border-radius: 50%; text-align: center; line-height: 32px; font-weight: bold; margin-right: 12px; }
        .progress-bar { width: 100%; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: #f97316; transition: width 0.3s; }
        .result-card { border-left: 4px solid #10b981; padding: 16px; margin-bottom: 12px; border-radius: 8px; }
        .result-card.wrong { border-left-color: #ef4444; background: #fef2f2; }
        .result-card.correct { background: #f0fdf4; }
        .score-display { background: linear-gradient(135deg, #f97316, #dc2626); color: white; padding: 40px; border-radius: 12px; text-align: center; margin-bottom: 30px; }
        .score-number { font-size: 4em; font-weight: bold; margin-bottom: 10px; }
        .icon-card { text-align: center; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: all 0.3s; }
        .icon-card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0,0,0,0.15); }
        .icon { font-size: 3em; margin-bottom: 10px; }
        .hidden { display: none; }
        .question-list { max-height: 400px; overflow-y: auto; }
        .question-item { border: 1px solid #e5e7eb; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .text-success { color: #10b981; font-weight: 600; }
        .text-small { font-size: 0.9em; color: #6b7280; }
        @media (max-width: 768px) { h1 { font-size: 2em; } .size-options { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        const questions = [
            { question: "Quelle est la température minimale requise pour le lavage des mains dans un restaurant O'Tacos ?", options: ["38°C", "25°C", "42°C", "50°C"], answer: "38°C" },
            { question: "Qu'est-ce qui est strictement interdit en cuisine selon le manuel de O'Tacos ?", options: ["Torchons et éponges", "Ustensiles en plastique", "Serviettes en papier", "Crayons alimentaires"], answer: "Torchons et éponges" },
            { question: "Quelle est la taille maximale du O'tacos proposée chez O'Tacos ?", options: ["M", "L", "XL", "Gigatacos"], answer: "Gigatacos" },
            { question: "Quel est le taux de composés polaires à ne pas dépasser dans l'huile de friture ?", options: ["23%", "14%", "10%", "30%"], answer: "23%" },
            { question: "Combien de fois par jour doit-on contrôler la température des chambres froides ?", options: ["Une fois par jour", "Deux fois par jour", "Trois fois par jour", "Toutes les heures"], answer: "Deux fois par jour" },
            { question: "Combien de temps maximum un produit décongelé peut-il être conservé au froid positif ?", options: ["24 heures", "48 heures", "72 heures", "96 heures"], answer: "72 heures" },
            { question: "Quel ingrédient est unique dans les O'tacos proposés par O'Tacos ?", options: ["Sauce barbecue", "Sauce fromagère", "Moutarde", "Sauce ketchup"], answer: "Sauce fromagère" },
            { question: "Quel est le délai maximal entre la prise de commande et la livraison d'un O'tacos ?", options: ["2 minutes", "4 minutes", "6 minutes", "8 minutes"], answer: "4 minutes" },
            { question: "Comment les produits doivent-ils être étiquetés après décongélation ?", options: ["Avec la date d'étiquetage", "Avec la date limite uniquement", "Avec date et heure décongélation et fin", "Avec le nom uniquement"], answer: "Avec date et heure décongélation et fin" },
            { question: "Quel appareil est utilisé pour mesurer la qualité de l'huile de friture ?", options: ["Thermomètre à sonde", "Thermo-hygromètre", "Le testo 270", "Tensiomètre"], answer: "Le testo 270" },
            { question: "Quel est l'un des quatre critères fondamentaux pour la satisfaction du client ?", options: ["La rapidité du service", "L'offre de boissons", "La variété des desserts", "L'ambiance musicale"], answer: "La rapidité du service" },
            { question: "Quelle est la température minimale à cœur pour conserver les produits chauds cuits ?", options: ["55°C", "60°C", "65°C", "70°C"], answer: "65°C" },
            { question: "Que doit-on faire en cas de détection de nuisibles ?", options: ["Noter dans un cahier", "Contacter une société spécialisée", "Fermer 24 heures", "Déplacer les produits"], answer: "Contacter une société spécialisée" },
            { question: "Quelle est la fréquence recommandée pour le nettoyage des machines à milk-shake ?", options: ["Une fois par semaine", "Deux fois par semaine", "Tous les jours", "Une fois par mois"], answer: "Tous les jours" },
            { question: "Que faut-il faire si un produit a dépassé sa date limite ?", options: ["Noter et conserver", "Noter et jeter immédiatement", "Changer l'étiquette", "Le congeler"], answer: "Noter et jeter immédiatement" },
            { question: "Quelle procédure faut-il suivre pour éviter la contamination croisée ?", options: ["Utiliser le même matériel pour tous", "Manipuler séparément les crus et les cuits", "Laver les mains toutes les heures", "Mélanger les produits"], answer: "Manipuler séparément les crus et les cuits" },
            { question: "Quelle taille d'O'tacos peut être vendue en version sucrée ?", options: ["M", "L", "XL", "O'mignon"], answer: "O'mignon" },
            { question: "Comment stocker les suppléments congelés ?", options: ["À température ambiante", "Au froid positif", "Au froid négatif", "Sur des étagères"], answer: "Au froid négatif" },
            { question: "Quel est le critère primordial lors du choix d'un fournisseur ?", options: ["Le prix des produits", "La proximité", "Le référencement O'Tacos", "La disponibilité immédiate"], answer: "Le référencement O'Tacos" },
            { question: "Quelle est la règle concernant les téléphones portables en cuisine ?", options: ["Autorisés s'ils sont propres", "Rangés dans une zone spécifique", "Utilisés uniquement pendant les pauses", "Strictement interdits"], answer: "Strictement interdits" },
            { question: "Comment doit-on traiter la zone propre ?", options: ["Stockage temporaire autorisé", "Zone sale jusqu'au nettoyage", "Zone à ne pas franchir par des produits sales", "Entreposage des déchets"], answer: "Zone à ne pas franchir par des produits sales" },
            { question: "Quel est le temps d'attente avant de mesurer la qualité de l'huile après cuisson ?", options: ["Immédiatement", "1 minute", "5 minutes", "10 minutes"], answer: "5 minutes" },
            { question: "Combien de combinaisons de O'Tacos sont possibles ?", options: ["100 000", "80 000", "50 000", "20 000"], answer: "80 000" },
            { question: "Comment conserver la sauce fromagère préparée ?", options: ["À température ambiante", "Au froid négatif", "Dans une étuve de maintien chaud", "Au congélateur"], answer: "Dans une étuve de maintien chaud" },
            { question: "Que faire en cas de panne d'électricité ?", options: ["Continuer à servir", "Fermer temporairement", "Appeler un technicien et continuer", "Utiliser des générateurs"], answer: "Fermer temporairement" },
            { question: "Quelles viandes sont cuites au four ?", options: ["Cordons bleus et nuggets", "Viande hachée et poulet", "Poulet pané et frites", "Merguez et jalapeños"], answer: "Viande hachée et poulet" },
            { question: "Quelle est la procédure pour le nettoyage des surfaces en cuisine ?", options: ["Utiliser de l'eau froide", "Utiliser des torchons réutilisables", "Suivre le plan de nettoyage défini", "Passer une éponge sur chaque surface"], answer: "Suivre le plan de nettoyage défini" },
            { question: "Quel est le temps d'attente maximum pour un client avant de recevoir son O'tacos ?", options: ["2 minutes", "4 minutes", "6 minutes", "8 minutes"], answer: "4 minutes" },
            { question: "Quelle est la température minimale lors de la cuisson des viandes ?", options: ["50°C", "60°C", "65°C", "70°C"], answer: "65°C" },
            { question: "Que signifie la marche en avant ?", options: ["Suivre les instructions du client", "Séparer les crus et les cuits", "Organiser le flux du propre vers le sale", "Manipuler avec précaution"], answer: "Organiser le flux du propre vers le sale" },
            { question: "Combien de tailles de O'Tacos sont disponibles ?", options: ["3 tailles", "4 tailles", "5 tailles", "6 tailles"], answer: "5 tailles" },
            { question: "Quelle boisson n'est pas incluse dans les menus ?", options: ["Coca-Cola", "Fanta", "Jus de pomme", "O'Shake"], answer: "Jus de pomme" },
            { question: "Quelle est la première étape du système HACCP ?", options: ["Fixer le seuil de danger", "Créer un dossier", "Analyser les dangers existants", "Contrôler la température"], answer: "Analyser les dangers existants" },
            { question: "Quelle est la durée maximale de conservation des viandes cuites dans l'étuve ?", options: ["1 heure", "2 heures", "4 heures", "6 heures"], answer: "2 heures" },
            { question: "Quel appareil utiliser pour vérifier la température des produits surgelés ?", options: ["Thermomètre à dilatation", "Thermomètre à sonde", "Testo 270", "Chronomètre"], answer: "Thermomètre à sonde" },
            { question: "Quelle zone du restaurant est considérée comme propre ?", options: ["Le comptoir", "La réserve", "La cuisine", "Les toilettes"], answer: "La cuisine" },
            { question: "Quelle est la réaction à avoir si la température d'un produit est non conforme ?", options: ["Continuer la cuisson", "Noter l'erreur", "Prendre des actions correctives immédiatement", "Ne pas en tenir compte"], answer: "Prendre des actions correctives immédiatement" },
            { question: "Quelle est la durée maximale de conservation des frites après cuisson ?", options: ["10 minutes", "20 minutes", "30 minutes", "40 minutes"], answer: "30 minutes" },
            { question: "Comment préparer la sauce fromagère ?", options: ["Mélangée à froid", "Réchauffée dans l'étuve", "Cuite à la friteuse", "Servie à température ambiante"], answer: "Réchauffée dans l'étuve" },
            { question: "Quels ingrédients ne sont jamais utilisés dans un O'tacos sucré ?", options: ["Sauce chocolat", "Viande hachée", "Fruits", "Sauce caramel"], answer: "Viande hachée" },
            { question: "Que faire si un problème d'hygiène est observé ?", options: ["Ignorer", "Signaler au manager immédiatement", "Attendre la fin de la journée", "Corriger seul"], answer: "Signaler au manager immédiatement" },
            { question: "Quel est le temps de cuisson moyen pour les viandes à frire chez O'Tacos ?", options: ["2 minutes", "3 minutes", "5 minutes", "7 minutes"], answer: "5 minutes" },
            { question: "Que signifie HACCP ?", options: ["Hazard Analysis Critical Control Point", "Healthy and Clean Cooking Procedures", "Hazard Avoidance Cleaning Process", "Health and Safety Cooking Policy"], answer: "Hazard Analysis Critical Control Point" },
            { question: "Quel type de sauce accompagne souvent les O'Tacos sucrés ?", options: ["Sauce fromagère", "Sauce barbecue", "Sauce chocolat", "Sauce ketchup"], answer: "Sauce chocolat" },
            { question: "Comment gérer un produit dont la température est trop élevée après cuisson ?", options: ["Mettre au congélateur", "Jeter immédiatement", "Laisser refroidir", "Réchauffer"], answer: "Jeter immédiatement" },
            { question: "Quelle est la méthode pour éviter la contamination croisée entre produits crus et cuits ?", options: ["Utiliser des petits matériels différents pour chaque type", "Laver les mains après les crus uniquement", "Mélanger dans des contenants séparés", "Tout au même endroit"], answer: "Utiliser des petits matériels différents pour chaque type" },
            { question: "Combien de temps après la commande doit-on servir un O'tacos ?", options: ["2 minutes", "4 minutes", "6 minutes", "8 minutes"], answer: "4 minutes" },
            { question: "Quelle est la règle concernant le port des tenues de travail chez O'Tacos ?", options: ["Portées à l'extérieur autorisé", "Propres et ne pas porter à l'extérieur", "Changées toutes les 2 semaines", "Facultatives"], answer: "Propres et ne pas porter à l'extérieur" },
            { question: "Quelle est la procédure de lavage des mains en cuisine ?", options: ["Une fois par jour", "Au savon anti-bactérien pendant au moins 20 secondes", "À l'eau froide", "Uniquement avec du gel"], answer: "Au savon anti-bactérien pendant au moins 20 secondes" },
            { question: "Quelle est la température de conservation dans les chambres froides négatives ?", options: ["Entre 0°C et 4°C", "Entre -18°C et -23°C", "Entre 4°C et 10°C", "Entre -10°C et -15°C"], answer: "Entre -18°C et -23°C" },
            { question: "Quelle est la cause principale de la présence de nuisibles ?", options: ["Mauvaise gestion des déchets", "Température trop basse", "Nettoyage trop fréquent", "Ingrédients périmés"], answer: "Mauvaise gestion des déchets" },
            { question: "Quel est le poids recommandé pour un O'tacos taille M ?", options: ["300g", "400g", "500g", "600g"], answer: "400g" },
            { question: "Que faire si un produit dépasse la limite de température après cuisson ?", options: ["Réduire la température de cuisson", "Jeter immédiatement", "Refroidir en chambre froide", "Conserver à température ambiante"], answer: "Jeter immédiatement" },
            { question: "Quelle taille d'O'tacos bénéficie du gratinage ?", options: ["O'mignon", "M", "L", "XL"], answer: "XL" },
            { question: "Quelle est la fréquence des contrôles de sécurité alimentaire par jour ?", options: ["Une fois", "Deux fois", "Trois fois", "Toutes les heures"], answer: "Deux fois" },
            { question: "Quelle est la durée de conservation des sauces au comptoir froid après ouverture ?", options: ["24 heures", "48 heures", "72 heures", "96 heures"], answer: "72 heures" },
            { question: "Que faire si un client se plaint de la qualité de son O'tacos ?", options: ["Ignorer la plainte", "Remplacer après vérification", "Offrir une réduction la prochaine fois", "Expliquer la conformité aux normes"], answer: "Remplacer après vérification" },
            { question: "Quel est le temps de maintien maximum des viandes cuites dans l'étuve chaude ?", options: ["1 heure", "2 heures", "3 heures", "4 heures"], answer: "2 heures" },
            { question: "Quel est le poids du Gigatacos chez O'Tacos ?", options: ["1 kg", "1,5 kg", "2 kg", "2,5 kg"], answer: "2 kg" },
            { question: "Comment stocker les boissons fraîches ?", options: ["À température ambiante", "Au froid négatif", "Au froid positif", "En réserve sèche"], answer: "Au froid positif" },
            { question: "Que signifie la marche en avant dans le temps ?", options: ["Séparer les zones propres et sales", "Utiliser les mêmes espaces à des moments différents", "Augmenter la productivité", "Servir selon l'ordre d'arrivée"], answer: "Utiliser les mêmes espaces à des moments différents" },
            { question: "Combien de contrôles de température sont obligatoires dans les chambres froides par jour ?", options: ["1", "2", "3", "4"], answer: "2" },
            { question: "Que faire si l'huile dépasse 23% de composés polaires ?", options: ["Continuer jusqu'à la fin de la journée", "Changer immédiatement", "Diluer avec de l'huile neuve", "Réduire la température de friture"], answer: "Changer immédiatement" },
            { question: "Combien de viandes différentes peut-on utiliser pour composer un O'tacos ?", options: ["1", "2", "3", "4"], answer: "2" },
            { question: "Quelle est la règle pour le contrôle des produits après réception ?", options: ["Utiliser le même équipement pour tous", "Vérifier la température des réfrigérés et des congelés", "Ne pas tenir compte des dates", "Mélanger périmés et non périmés"], answer: "Vérifier la température des réfrigérés et des congelés" },
            { question: "Quelle est la taille maximale d'O'tacos proposée pour la livraison ?", options: ["M", "L", "XL", "Gigatacos"], answer: "XL" },
            { question: "Quelle est la température idéale pour la conservation des boissons ?", options: ["0°C", "Entre 1°C et 4°C", "Entre 4°C et 10°C", "Température ambiante"], answer: "Entre 1°C et 4°C" },
            { question: "Que faut-il utiliser pour nettoyer les surfaces de préparation ?", options: ["Des torchons réutilisables", "Des lingettes désinfectantes à usage unique", "Une éponge classique", "Un chiffon humide"], answer: "Des lingettes désinfectantes à usage unique" },
            { question: "Combien de suppléments peut-on ajouter dans un O'tacos ?", options: ["1", "2", "3", "Autant que souhaité"], answer: "Autant que souhaité" },
            { question: "Que faire en cas de coupure de courant ?", options: ["Servir les clients avec les produits disponibles", "Fermer immédiatement le restaurant", "Continuer à préparer les commandes", "Attendre que le courant revienne"], answer: "Fermer immédiatement le restaurant" },
            { question: "Quelle est la raison principale de contrôler la qualité de l'huile de friture ?", options: ["Conserver l'huile longtemps", "Éviter la contamination des produits", "Garantir la qualité des produits frits et la santé des clients", "Réduire les coûts d'approvisionnement"], answer: "Garantir la qualité des produits frits et la santé des clients" },
            { question: "Que faire si un ingrédient présente des signes de contamination ?", options: ["Le cuisiner immédiatement", "Le signaler et le jeter", "Le congeler pour éviter la propagation", "L'utiliser en dernier recours"], answer: "Le signaler et le jeter" },
            { question: "Quelle est la fréquence de vérification de l'hygiène du personnel par jour ?", options: ["Une fois", "Deux fois", "Toutes les heures", "En continu"], answer: "En continu" },
            { question: "Que faut-il utiliser pour mesurer la température des aliments cuits ?", options: ["Un thermomètre à dilatation", "Un thermomètre à sonde", "Un chronomètre", "Le testo 270"], answer: "Un thermomètre à sonde" },
            { question: "Comment éviter la contamination croisée dans le restaurant ?", options: ["Nettoyer toutes les 2 heures", "Utiliser du petit matériel différent pour les crus et les cuits", "Mélanger les produits après cuisson", "Conserver les crus et les cuits dans la même zone"], answer: "Utiliser du petit matériel différent pour les crus et les cuits" },
            { question: "Que faire si la machine à milkshake n'est pas nettoyée correctement ?", options: ["La nettoyer au début du lendemain", "Ne pas l'utiliser tant qu'elle n'est pas nettoyée", "Continuer à l'utiliser et nettoyer plus tard", "Demander au client"], answer: "Ne pas l'utiliser tant qu'elle n'est pas nettoyée" },
            { question: "Quelle est la température maximale pour le froid positif ?", options: ["2°C", "4°C", "6°C", "8°C"], answer: "4°C" }
        ];

        const restaurants = ['Louvain-La-Neuve', 'Auderghem', 'Uccle', 'Halle', 'Soignies', 'Ath', 'Renaix', 'Mouscron'];

        let state = {
            view: 'home',
            employeeName: '',
            restaurant: '',
            quizSize: 10,
            currentQuiz: [],
            currentQuestion: 0,
            answers: [],
            history: JSON.parse(localStorage.getItem('otacos-history') || '[]')
        };

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'home') app.innerHTML = renderHome();
            else if (state.view === 'quiz') app.innerHTML = renderQuiz();
            else if (state.view === 'results') app.innerHTML = renderResults();
            else if (state.view === 'history') app.innerHTML = renderHistory();
        }

        function renderHome() {
            return `
                <div class="card">
                    <h1>🌮 Quiz O'Tacos</h1>
                    <p class="subtitle">Groupe AMAUH - Contrôle des connaissances terrain</p>
                    
                    <div class="grid">
                        <div class="form-group">
                            <label>Nom de l'équipier</label>
                            <input type="text" id="employeeName" placeholder="Prénom Nom" value="${state.employeeName}">
                        </div>
                        <div class="form-group">
                            <label>Restaurant</label>
                            <select id="restaurant">
                                <option value="">Sélectionner...</option>
                                ${restaurants.map(r => `<option value="${r}" ${state.restaurant === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="quiz-size">
                        <label>Nombre de questions pour le quiz</label>
                        <div class="size-options">
                            ${[5, 10, 15, 20].map(size => `
                                <button class="size-btn ${state.quizSize === size ? 'active' : ''}" onclick="setQuizSize(${size})">${size}</button>
                            `).join('')}
                        </div>
                        <p class="text-small" style="margin-top: 10px;">Banque actuelle : ${questions.length} questions</p>
                    </div>

                    <button class="btn btn-primary" onclick="startQuiz()">🎲 Générer un Quiz Aléatoire</button>
                </div>

                <div class="grid">
                    <div class="icon-card" onclick="state.view='history'; render();">
                        <div class="icon">📊</div>
                        <h3>Historique</h3>
                        <p class="text-small">${state.history.length} quiz réalisés</p>
                    </div>
                    <div class="icon-card" onclick="exportData()">
                        <div class="icon">💾</div>
                        <h3>Sauvegarder</h3>
                        <p class="text-small">Export JSON</p>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            const q = state.currentQuiz[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / state.currentQuiz.length) * 100;
            
            return `
                <div class="card">
                    <div class="flex-between" style="margin-bottom: 15px;">
                        <span style="font-weight: 600; color: #6b7280;">Question ${state.currentQuestion + 1} / ${state.currentQuiz.length}</span>
                        <span style="font-weight: 600; color: #f97316;">${state.employeeName}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    
                    <h2>${q.question}</h2>
                    
                    <div>
                        ${q.options.map((opt, idx) => `
                            <button class="option-btn" onclick="answerQuestion('${opt.replace(/'/g, "\\'")}')">
                                <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderResults() {
            const r = state.results;
            const icon = r.percentage >= 80 ? '✅' : r.percentage >= 60 ? '⚠️' : '❌';
            
            return `
                <div class="card">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div style="font-size: 5em; margin-bottom: 20px;">${icon}</div>
                        <h1 style="margin-bottom: 10px;">Résultats du Quiz</h1>
                        <p style="color: #6b7280; font-size: 1.1em;">${r.employeeName} - ${r.restaurant}</p>
                        <p class="text-small">${r.date}</p>
                    </div>

                    <div class="score-display">
                        <div class="score-number">${r.percentage}%</div>
                        <div style="font-size: 1.3em;">${r.score} / ${r.total} bonnes réponses</div>
                    </div>

                    <div style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;">
                        ${r.details.map(d => `
                            <div class="result-card ${d.isCorrect ? 'correct' : 'wrong'}">
                                <div style="display: flex; gap: 15px;">
                                    <div style="font-size: 1.5em;">${d.isCorrect ? '✅' : '❌'}</div>
                                    <div style="flex: 1;">
                                        <p style="font-weight: 600; margin-bottom: 8px;">${d.question}</p>
                                        <p class="text-small">Réponse donnée : ${d.userAnswer}</p>
                                        ${!d.isCorrect ? `<p class="text-success" style="margin-top: 5px;">Bonne réponse : ${d.correctAnswer}</p>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid">
                        <button class="btn btn-primary" onclick="resetQuiz()">Nouveau Quiz</button>
                        <button class="btn btn-secondary" onclick="state.view='history'; render();">Voir l'Historique</button>
                    </div>
                </div>
            `;
        }

        function renderHistory() {
            return `
                <div class="card">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <h2>Historique des Quiz (${state.history.length})</h2>
                        <button class="btn btn-secondary btn-small" onclick="state.view='home'; render();">Retour</button>
                    </div>

                    ${state.history.length === 0 ? 
                        '<p style="text-align: center; color: #6b7280; padding: 40px;">Aucun quiz réalisé</p>' :
                        state.history.map(h => `
                            <div class="question-item">
                                <div class="flex-between">
                                    <div>
                                        <h3>${h.employeeName}</h3>
                                        <p class="text-small">${h.restaurant} - ${h.date}</p>
                                        <p class="text-small" style="margin-top: 5px;">${h.score} / ${h.total} réponses correctes</p>
                                    </div>
                                    <div style="font-size: 2em; font-weight: bold; color: ${h.percentage >= 80 ? '#10b981' : h.percentage >= 60 ? '#f59e0b' : '#ef4444'};">
                                        ${h.percentage}%
                                    </div>
                                </div>
                            </div>
                        `).join('')
                    }
                </div>
            `;
        }

        function setQuizSize(size) {
            state.quizSize = size;
            render();
        }

        function startQuiz() {
            state.employeeName = document.getElementById('employeeName').value;
            state.restaurant = document.getElementById('restaurant').value;

            if (!state.employeeName || !state.restaurant) {
                alert('Veuillez renseigner le nom et le restaurant');
                return;
            }

            const shuffled = [...questions].sort(() => Math.random() - 0.5);
            state.currentQuiz = shuffled.slice(0, state.quizSize);
            state.currentQuestion = 0;
            state.answers = [];
            state.view = 'quiz';
            render();
        }

        function answerQuestion(answer) {
            state.answers.push(answer);
            
            if (state.currentQuestion < state.currentQuiz.length - 1) {
                state.currentQuestion++;
                render();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const score = state.answers.filter((ans, idx) => ans === state.currentQuiz[idx].answer).length;
            const percentage = Math.round((score / state.currentQuiz.length) * 100);
            
            state.results = {
                employeeName: state.employeeName,
                restaurant: state.restaurant,
                date: new Date().toLocaleString('fr-BE'),
                score,
                total: state.currentQuiz.length,
                percentage,
                details: state.currentQuiz.map((q, idx) => ({
                    question: q.question,
                    userAnswer: state.answers[idx],
                    correctAnswer: q.answer,
                    isCorrect: state.answers[idx] === q.answer
                }))
            };
            
            state.history.unshift(state.results);
            localStorage.setItem('otacos-history', JSON.stringify(state.history));
            state.view = 'results';
            render();
        }

        function resetQuiz() {
            state.view = 'home';
            state.employeeName = '';
            state.restaurant = '';
            render();
        }

        function exportData() {
            const data = { questions, history: state.history };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'otacos-quiz-backup.json';
            a.click();
        }

        render();
    </script>
</body>
</html>
