            { question: "Que signifie la marche en avant dans l'espace chez O'Tacos ?", options: ["Déplacer les produits dans l'ordre de préparation", "Séparer les zones propres et les zones sales", "Créer un flux continu de clients dans le restaurant", "Organiser les livraisons des produits alimentaires"], answer: "Séparer les zones propres et les zones sales" },
            { question: "Que signifie le temps de maintien pour les viandes cuites chez O'Tacos ?", options: ["Le temps de cuisson", "Le temps de conservation après cuisson à une température donnée", "Le temps nécessaire pour préparer les ingrédients", "Le temps d'attente entre la cuisson et le service"], answer: "Le temps de conservation après cuisson à une température donnée" },
            { question: "Quelle est la taille d'un O'tacos O'mignon ?", options: ["300g", "250g", "200g", "150g"], answer: "200g" },
            { question: "Que faut-il vérifier avant d'utiliser un produit congelé chez O'Tacos ?", options: ["La température de la pièce", "La couleur du produit", "La date limite et la température de stockage", "La taille de l'emballage"], answer: "La date limite et la température de stockage" },
            { question: "Que faut-il faire si un produit en cours de décongélation a dépassé sa date limite ?", options: ["Le remettre au congélateur", "Le cuisiner immédiatement", "Le jeter immédiatement", "Le conserver au froid positif"], answer: "Le jeter immédiatement" },
            { question: "Qu'est-ce qui caractérise la cuisson des viandes chez O'Tacos ?", options: ["Les viandes sont toutes frites", "Les viandes sont grillées sur un gril", "Certaines viandes sont cuites au four et d'autres à la friteuse", "Toutes les viandes sont cuites au micro-ondes"], answer: "Certaines viandes sont cuites au four et d'autres à la friteuse" },
            { question: "Combien de produits peuvent être assemblés dans un O'tacos Gigatacos ?", options: ["3", "4", "5", "Autant que souhaité"], answer: "Autant que souhaité" },
            { question: "Que doit-on faire si un client est allergique à un ingrédient chez O'Tacos ?", options: ["Lui offrir une réduction", "Lui proposer un autre produit", "Lui conseiller de vérifier la liste des allergènes avant de commander", "Préparer son O'tacos en utilisant les mêmes équipements"], answer: "Lui conseiller de vérifier la liste des allergènes avant de commander" },
            { question: "Quelle est la durée maximale de stockage des viandes au froid négatif chez O'Tacos ?", options: ["3 jours", "7 jours", "15 jours", "Selon la date limite de consommation"], answer: "Selon la date limite de consommation" },
            { question: "Que faut-il faire avant de servir un O'tacos au client ?", options: ["Vérifier le ticket de caisse et la commande", "Le réchauffer une dernière fois", "Ajouter des suppléments non demandés", "Le servir directement sans vérification"], answer: "Vérifier le ticket de caisse et la commande" },
            { question: "Combien de fois par an une entreprise spécialisée doit-elle contrôler les nuisibles dans un restaurant O'Tacos ?", options: ["Une fois par an", "Deux fois par an", "Trois fois par an", "Quatre fois par an"], answer: "Quatre fois par an" },
            { question: "Que doit-on faire si la température d'une chambre froide est supérieure à la norme ?", options: ["Continuer de l'utiliser tant que les produits sont frais", "Jeter immédiatement tous les produits", "Prendre des actions correctives immédiates et vérifier la sonde", "Laisser la chambre refroidir naturellement"], answer: "Prendre des actions correctives immédiates et vérifier la sonde" },
            { question: "Que faut-il faire si l'étiquette d'un produit est illisible ou manquante ?", options: ["Ne pas l'utiliser tant que l'étiquette n'est pas mise à jour", "L'utiliser immédiatement", "Remplacer l'étiquette par une nouvelle", "Le conserver au froid négatif"], answer: "Ne pas l'utiliser tant que l'étiquette n'est pas mise à jour" },
            { question: "Quelle est la règle concernant le port de bijoux en cuisine chez O'Tacos ?", options: ["Les bijoux sont autorisés s'ils sont discrets", "Tous les bijoux sont strictement interdits", "Les bagues sont autorisées mais pas les bracelets", "Les colliers sont autorisés en cuisine"], answer: "Tous les bijoux sont strictement interdits" },
            { question: "Que doit faire un employé s'il casse un thermomètre en cuisine chez O'Tacos ?", options: ["Continuer à travailler sans thermomètre", "Remplacer immédiatement le thermomètre et signaler l'incident", "Ramasser les morceaux et les jeter", "Ignorer l'incident et finir le service"], answer: "Remplacer immédiatement le thermomètre et signaler l'incident" },
            { question: "Que faut-il faire en cas de présence de nuisibles dans un restaurant O'Tacos ?", options: ["Augmenter la température des chambres froides", "Continuer à travailler sans modification", "Appeler immédiatement une société spécialisée et agir selon le plan de lutte contre les nuisibles", "Fermer le restaurant sans prévenir"], answer: "Appeler immédiatement une société spécialisée et agir selon le plan de lutte contre les nuisibles" },
            { question: "Quel type de viande ne peut pas être utilisé dans un O'tacos sucré ?", options: ["Viande hachée", "Poulet grillé", "Cordons bleus", "Aucune viande n'est utilisée dans un O'tacos sucré"], answer: "Aucune viande n'est utilisée dans un O'tacos sucré" },
            { question: "Que signifie le terme gratinage chez O'Tacos ?", options: ["Ajouter de la sauce fromagère sur l'O'tacos", "Cuire l'O'tacos plus longtemps pour obtenir une texture croustillante", "Passer l'O'tacos sous un grill pour dorer la surface", "Ajouter des frites dans l'O'tacos"], answer: "Passer l'O'tacos sous un grill pour dorer la surface" },
            { question: "Quelle est la priorité absolue chez O'Tacos lors de la préparation des O'tacos ?", options: ["La rapidité de la commande", "La satisfaction client", "Le respect des règles de sécurité alimentaire", "L'esthétique de l'O'tacos"], answer: "Le respect des règles de sécurité alimentaire" },
            { question: "Que faut-il faire si un client demande un ingrédient en dehors des procédures standards ?", options: ["Accepter la demande immédiatement", "Lui expliquer que cela n'est pas possible pour des raisons de sécurité alimentaire", "Ajouter l'ingrédient sans vérifier", "Contacter un responsable avant de répondre"], answer: "Lui expliquer que cela n'est pas possible pour des raisons de sécurité alimentaire" },
            { question: "Quelle est la première chose à faire avant de préparer un O'tacos ?", options: ["S'assurer que tous les ingrédients sont disponibles", "Vérifier le ticket de caisse", "Chauffer la tortilla", "Laver les mains selon la procédure"], answer: "Laver les mains selon la procédure" },
            { question: "Quelle est la procédure à suivre si l'équipement de cuisson ne fonctionne pas correctement ?", options: ["Continuer de l'utiliser tant qu'il est encore chaud", "Éteindre l'équipement et le signaler immédiatement", "Réparer l'équipement soi-même", "L'utiliser uniquement pour les produits crus"], answer: "Éteindre l'équipement et le signaler immédiatement" },
            { question: "Que doit faire un employé qui observe un collègue ne respectant pas les règles d'hygiène en cuisine ?", options: ["Ignorer la situation", "Le signaler immédiatement à un responsable", "Attendre la fin de la journée pour en parler", "Le corriger discrètement sans en parler"], answer: "Le signaler immédiatement à un responsable" },
            { question: "Que doit-on faire si la température d'un produit cuit ne dépasse pas les 65°C après cuisson ?", options: ["Le refroidir rapidement", "Le remettre à cuire jusqu'à atteindre la bonne température", "Le servir immédiatement pour éviter qu'il ne refroidisse davantage", "Le congeler pour une utilisation ultérieure"], answer: "Le remettre à cuire jusqu'à atteindre la bonne température" },
            { question: "Comment sont classées les zones du restaurant O'Tacos ?", options: ["Par niveaux d'importance", "Par couleur", "En zones propres et zones sales", "En zones chaudes et zones froides"], answer: "En zones propres et zones sales" },
            { question: "Quelle est la température minimale requise pour maintenir les produits cuits dans le meuble chaud ?", options: ["55°C", "60°C", "65°C", "70°C"], answer: "65°C" },
            { question: "Quelle est la meilleure méthode pour vérifier la cuisson d'un O'tacos ?", options: ["Le toucher pour voir s'il est chaud", "Utiliser un thermomètre à sonde pour vérifier la température", "Le couper en deux pour vérifier l'intérieur", "Observer le grillage extérieur"], answer: "Utiliser un thermomètre à sonde pour vérifier la température" },
            { question: "Que doit-on vérifier avant de servir un O'tacos au client ?", options: ["Demander au client de vérifier sa commande", "Vérifier que la commande est complète et conforme au ticket de caisse", "Ajouter des ingrédients supplémentaires gratuitement", "L'emballer rapidement et le servir immédiatement"], answer: "Vérifier que la commande est complète et conforme au ticket de caisse" },
            { question: "Combien de produits peuvent être ajoutés dans un O'tacos XL ?", options: ["1 ingrédient supplémentaire", "2 ingrédients supplémentaires", "3 ingrédients supplémentaires", "Autant que le client souhaite"], answer: "Autant que le client souhaite" },
            { question: "Combien de fois par jour les surfaces de travail doivent-elles être nettoyées chez O'Tacos ?", options: ["Une fois par jour", "Deux fois par jour", "Après chaque service", "Selon le plan de nettoyage"], answer: "Selon le plan de nettoyage" },
            { question: "Quel est l'élément distinctif du O'tacos par rapport aux autres types de tacos ?", options: ["Sa taille", "La présence de frites à l'intérieur", "Une cuisson grillée", "La sauce fromagère unique"], answer: "La sauce fromagère unique" },
            { question: "Que signifie plonger dans le contexte de la cuisine chez O'Tacos ?", options: ["Nettoyer les ustensiles dans de l'eau bouillante", "Cuire les viandes dans la friteuse", "Tremper les frites dans la sauce fromagère", "Maintenir les viandes dans l'étuve"], answer: "Cuire les viandes dans la friteuse" },
            { question: "Quelle est la procédure à suivre pour contrôler la qualité de l'huile de friture chez O'Tacos ?", options: ["Utiliser un thermomètre", "Tester l'huile avec un appareil comme le Testo 270", "Regarder la couleur de l'huile", "Ajouter de l'huile neuve si elle est trop foncée"], answer: "Tester l'huile avec un appareil comme le Testo 270" },
            { question: "Que signifie TDM dans le contexte des produits O'Tacos ?", options: ["Temps de décongélation maximale", "Temps dans le meuble après cuisson", "Temps de maintien dans la friteuse", "Temps de cuisson des frites"], answer: "Temps dans le meuble après cuisson" },
            { question: "Quelle procédure doit être suivie si un produit est trouvé dans une zone sale du restaurant ?", options: ["Le laver et le réutiliser", "Le signaler et le jeter", "Le transférer dans une zone propre", "Le remballer pour le conserver"], answer: "Le signaler et le jeter" },
            { question: "Que doit-on vérifier après la cuisson d'un O'tacos gratiné ?", options: ["Que le fromage est bien fondu", "Que les frites sont croustillantes", "Que l'emballage est propre", "Que le gratinage est doré uniformément"], answer: "Que le gratinage est doré uniformément" },
            { question: "Que signifie le terme HACCP dans le contexte de la sécurité alimentaire chez O'Tacos ?", options: ["Analyse des risques et points critiques pour la maîtrise", "Procédure de gestion des stocks", "Méthode de cuisson des viandes", "Système de service client"], answer: "Analyse des risques et points critiques pour la maîtrise" },
            { question: "Que doit-on faire en cas de panne d'un équipement essentiel en cuisine ?", options: ["Continuer le service sans équipement", "Appeler immédiatement un technicien et arrêter le service si nécessaire", "Utiliser un autre équipement même s'il n'est pas prévu pour cela", "Remplacer l'équipement par un équivalent de qualité inférieure"], answer: "Appeler immédiatement un technicien et arrêter le service si nécessaire" },
            { question: "Combien de fois par jour les employés doivent-ils se laver les mains dans un restaurant O'Tacos ?", options: ["Une fois au début de la journée", "Toutes les heures", "Au moins une fois toutes les 20 minutes", "Seulement avant et après les pauses"], answer: "Au moins une fois toutes les 20 minutes" },
            { question: "Que doit-on faire si un produit est retrouvé sans étiquette de date limite dans un restaurant O'Tacos ?", options: ["Le réétiqueter immédiatement", "Le jeter immédiatement", "Le conserver jusqu'à trouver sa date d'expiration", "Le placer au congélateur pour le stocker"], answer: "Le jeter immédiatement" },
            { question: "Combien de fois par an le testo 270 doit-il être étalonné ?", options: ["Une fois par an", "Deux fois par an", "Trois fois par an", "Tous les mois"], answer: "Deux fois par an" },
            { question: "Quelle est la durée maximale pour conserver un O'tacos gratiné avant de le servir ?", options: ["5 minutes", "10 minutes", "15 minutes", "20 minutes"], answer: "10 minutes" },
            { question: "Quel est l'objectif principal des contrôles HACCP dans un restaurant O'Tacos ?", options: ["Vérifier la rapidité du service", "Réduire les coûts de production", "Assurer la sécurité alimentaire en identifiant et en maîtrisant les risques", "Améliorer la qualité visuelle des produits"], answer: "Assurer la sécurité alimentaire en identifiant et en maîtrisant les risques" },
            { question: "Comment les produits sont-ils classés chez O'Tacos ?", options: ["Produits crus et cuits", "Produits principaux et suppléments", "Produits finis et ingrédients", "Produits chauds et froids"], answer: "Produits finis et ingrédients" },
            { question: "Que doit-on faire en cas d'alerte incendie dans un restaurant O'Tacos ?", options: ["Continuer à servir les clients", "Évacuer immédiatement le restaurant", "Utiliser un extincteur et reprendre le service", "Attendre la confirmation du manager pour réagir"], answer: "Évacuer immédiatement le restaurant" },
            { question: "Comment sont classées les zones propres et sales dans un restaurant O'Tacos ?", options: ["Par l'utilisation des équipements spécifiques", "Selon la présence de clients dans la zone", "En fonction des types de produits manipulés", "Par les risques de contamination liés aux activités"], answer: "Par les risques de contamination liés aux activités" },
            { question: "Quelle est la première étape à suivre après avoir reçu une livraison de produits chez O'Tacos ?", options: ["Signer le bon de livraison", "Vérifier la température des produits", "Placer immédiatement les produits dans les zones de stockage", "Préparer les commandes pour les clients"], answer: "Vérifier la température des produits" },
            { question: "Que doit-on faire avant de manipuler les ingrédients dans la cuisine chez O'Tacos ?", options: ["S'assurer que les ustensiles sont propres", "Porter un tablier propre", "Se laver les mains selon les règles d'hygiène", "Chauffer les équipements de cuisson"], answer: "Se laver les mains selon les règles d'hygiène" }
        ];

        const restaurants = ['Louvain-La-Neuve', 'Auderghem', 'Uccle', 'Halle', 'Soignies', 'Ath', 'Renaix', 'Mouscron'];

        let state = {
            view: 'home',
            employeeName: '',
            restaurant: '',
            quizSize: 10,
            currentQuiz: [],
            currentQuestion: 0,
            answers: [],
            history: JSON.parse(localStorage.getItem('otacos-history') || '[]')
        };

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'home') app.innerHTML = renderHome();
            else if (state.view === 'quiz') app.innerHTML = renderQuiz();
            else if (state.view === 'results') app.innerHTML = renderResults();
            else if (state.view === 'history') app.innerHTML = renderHistory();
        }

        function renderHome() {
            return `
                <div class="card">
                    <h1>🌮 Quiz O'Tacos</h1>
                    <p class="subtitle">Groupe AMAUH - Contrôle des connaissances terrain</p>
                    
                    <div class="grid">
                        <div class="form-group">
                            <label>Nom de l'équipier</label>
                            <input type="text" id="employeeName" placeholder="Prénom Nom" value="${state.employeeName}">
                        </div>
                        <div class="form-group">
                            <label>Restaurant</label>
                            <select id="restaurant">
                                <option value="">Sélectionner...</option>
                                ${restaurants.map(r => `<option value="${r}" ${state.restaurant === r ? 'selected' : ''}>${r}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div class="quiz-size">
                        <label>Nombre de questions pour le quiz</label>
                        <div class="size-options">
                            ${[5, 10, 15, 20, 30].map(size => `
                                <button class="size-btn ${state.quizSize === size ? 'active' : ''}" onclick="setQuizSize(${size})">${size}</button>
                            `).join('')}
                        </div>
                        <p class="text-small" style="margin-top: 10px;">Banque actuelle : ${questions.length} questions</p>
                    </div>

                    <button class="btn btn-primary" onclick="startQuiz()">🎲 Générer un Quiz Aléatoire</button>
                </div>

                <div class="grid">
                    <div class="icon-card" onclick="state.view='history'; render();">
                        <div class="icon">📊</div>
                        <h3>Historique</h3>
                        <p class="text-small">${state.history.length} quiz réalisés</p>
                    </div>
                    <div class="icon-card" onclick="exportData()">
                        <div class="icon">💾</div>
                        <h3>Sauvegarder</h3>
                        <p class="text-small">Export JSON</p>
                    </div>
                </div>
            `;
        }

        function renderQuiz() {
            const q = state.currentQuiz[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / state.currentQuiz.length) * 100;
            
            return `
                <div class="card">
                    <div class="flex-between" style="margin-bottom: 15px;">
                        <span style="font-weight: 600; color: #6b7280;">Question ${state.currentQuestion + 1} / ${state.currentQuiz.length}</span>
                        <span style="font-weight: 600; color: #f97316;">${state.employeeName}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    
                    <h2>${q.question}</h2>
                    
                    <div>
                        ${q.options.map((opt, idx) => `
                            <button class="option-btn" onclick="answerQuestion('${opt.replace(/'/g, "\\'")}')">
                                <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderResults() {
            const r = state.results;
            const icon = r.percentage >= 80 ? '✅' : r.percentage >= 60 ? '⚠️' : '❌';
            
            return `
                <div class="card">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <div style="font-size: 5em; margin-bottom: 20px;">${icon}</div>
                        <h1 style="margin-bottom: 10px;">Résultats du Quiz</h1>
                        <p style="color: #6b7280; font-size: 1.1em;">${r.employeeName} - ${r.restaurant}</p>
                        <p class="text-small">${r.date}</p>
                    </div>

                    <div class="score-display">
                        <div class="score-number">${r.percentage}%</div>
                        <div style="font-size: 1.3em;">${r.score} / ${r.total} bonnes réponses</div>
                    </div>

                    <div style="max-height: 400px; overflow-y: auto; margin-bottom: 20px;">
                        ${r.details.map(d => `
                            <div class="result-card ${d.isCorrect ? 'correct' : 'wrong'}">
                                <div style="display: flex; gap: 15px;">
                                    <div style="font-size: 1.5em;">${d.isCorrect ? '✅' : '❌'}</div>
                                    <div style="flex: 1;">
                                        <p style="font-weight: 600; margin-bottom: 8px;">${d.question}</p>
                                        <p class="text-small">Réponse donnée : ${d.userAnswer}</p>
                                        ${!d.isCorrect ? `<p class="text-success" style="margin-top: 5px;">Bonne réponse : ${d.correctAnswer}</p>` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid">
                        <button class="btn btn-primary" onclick="resetQuiz()">Nouveau Quiz</button>
                        <button class="btn btn-secondary" onclick="state.view='history'; render();">Voir l'Historique</button>
                    </div>
                </div>
            `;
        }

        function renderHistory() {
            return `
                <div class="card">
                    <div class="flex-between" style="margin-bottom: 20px;">
                        <h2>Historique des Quiz (${state.history.length})</h2>
                        <button class="btn btn-secondary btn-small" onclick="state.view='home'; render();">Retour</button>
                    </div>

                    ${state.history.length === 0 ? 
                        '<p style="text-align: center; color: #6b7280; padding: 40px;">Aucun quiz réalisé</p>' :
                        state.history.map(h => `
                            <div class="question-item">
                                <div class="flex-between">
                                    <div>
                                        <h3>${h.employeeName}</h3>
                                        <p class="text-small">${h.restaurant} - ${h.date}</p>
                                        <p class="text-small" style="margin-top: 5px;">${h.score} / ${h.total} réponses correctes</p>
                                    </div>
                                    <div style="font-size: 2em; font-weight: bold; color: ${h.percentage >= 80 ? '#10b981' : h.percentage >= 60 ? '#f59e0b' : '#ef4444'};">
                                        ${h.percentage}%
                                    </div>
                                </div>
                            </div>
                        `).join('')
                    }
                </div>
            `;
        }

        function setQuizSize(size) {
            state.quizSize = size;
            render();
        }

        function startQuiz() {
            state.employeeName = document.getElementById('employeeName').value;
            state.restaurant = document.getElementById('restaurant').value;

            if (!state.employeeName || !state.restaurant) {
                alert('Veuillez renseigner le nom et le restaurant');
                return;
            }

            const shuffled = [...questions].sort(() => Math.random() - 0.5);
            state.currentQuiz = shuffled.slice(0, state.quizSize);
            state.currentQuestion = 0;
            state.answers = [];
            state.view = 'quiz';
            render();
        }

        function answerQuestion(answer) {
            state.answers.push(answer);
            
            if (state.currentQuestion < state.currentQuiz.length - 1) {
                state.currentQuestion++;
                render();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const score = state.answers.filter((ans, idx) => ans === state.currentQuiz[idx].answer).length;
            const percentage = Math.round((score / state.currentQuiz.length) * 100);
            
            state.results = {
                employeeName: state.employeeName,
                restaurant: state.restaurant,
                date: new Date().toLocaleString('fr-BE'),
                score,
                total: state.currentQuiz.length,
                percentage,
                details: state.currentQuiz.map((q, idx) => ({
                    question: q.question,
                    userAnswer: state.answers[idx],
                    correctAnswer: q.answer,
                    isCorrect: state.answers[idx] === q.answer
                }))
            };
            
            state.history.unshift(state.results);
            localStorage.setItem('otacos-history', JSON.stringify(state.history));
            state.view = 'results';
            render();
        }

        function resetQuiz() {
            state.view = 'home';
            state.employeeName = '';
            state.restaurant = '';
            render();
        }

        function exportData() {
            const data = { questions, history: state.history };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'otacos-quiz-backup.json';
            a.click();
        }

        render();
    </script>
</body>
</html>
